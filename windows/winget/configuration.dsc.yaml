# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# Core dev setup. Apply with: winget configure -f windows\winget\configuration.dsc.yaml
# Node is deliberately absent - install it through fnm (fnm install --lts).
# Visual Studio workloads are picked manually in the VS Installer afterwards.
properties:
  configurationVersion: 0.2.0
  resources:
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Git.Git
      directives:
        description: Git
      settings:
        id: Git.Git
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: GitHub.cli
      directives:
        description: GitHub CLI
      settings:
        id: GitHub.cli
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: GitHub.GitHubDesktop
      directives:
        description: GitHub Desktop
      settings:
        id: GitHub.GitHubDesktop
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Microsoft.VisualStudioCode
      directives:
        description: Visual Studio Code
      settings:
        id: Microsoft.VisualStudioCode
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Microsoft.WindowsTerminal
      directives:
        description: Windows Terminal
      settings:
        id: Microsoft.WindowsTerminal
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Microsoft.PowerShell
      directives:
        description: PowerShell 7
      settings:
        id: Microsoft.PowerShell
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: JanDeDobbeleer.OhMyPosh
      directives:
        description: Oh My Posh prompt
      settings:
        id: JanDeDobbeleer.OhMyPosh
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: DEVCOM.JetBrainsMonoNerdFont
      directives:
        description: Nerd Font for Oh My Posh
      settings:
        id: DEVCOM.JetBrainsMonoNerdFont
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: twpayne.chezmoi
      directives:
        description: chezmoi dotfile manager
      settings:
        id: twpayne.chezmoi
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Schniz.fnm
      directives:
        description: fnm Node version manager
      settings:
        id: Schniz.fnm
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: astral-sh.uv
      directives:
        description: uv Python and package manager
      settings:
        id: astral-sh.uv
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: GoLang.Go
      directives:
        description: Go
      settings:
        id: GoLang.Go
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: JetBrains.Toolbox
      directives:
        description: JetBrains Toolbox
      settings:
        id: JetBrains.Toolbox
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Microsoft.VisualStudio.2022.Community
      directives:
        description: Visual Studio Community 2022
      settings:
        id: Microsoft.VisualStudio.2022.Community
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Docker.DockerDesktop
      directives:
        description: Docker Desktop
      settings:
        id: Docker.DockerDesktop
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Microsoft.WSL
      directives:
        description: WSL
      settings:
        id: Microsoft.WSL
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Google.Chrome
      directives:
        description: Google Chrome
      settings:
        id: Google.Chrome
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: 7zip.7zip
      directives:
        description: 7-Zip
      settings:
        id: 7zip.7zip
        source: winget
